<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 1092" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Theoretical scope of the InTRACt study"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#33567a"/></marker></defs><rect x="0" y="0" width="950" height="1092" fill="#ffffff"/><rect x="14.0" y="14.0" width="922.0" height="185.0" rx="6" fill="#f5f5f5" stroke="#e2e2e2" stroke-width="1.2"/> <text x="26.0" y="32.0" font-size="13" fill="#6b6b6b" font-weight="bold" font-style="normal" text-anchor="start">Established findings the theory builds on</text> <rect x="26.0" y="52.0" width="214.8" height="135.0" rx="6" fill="#eef1f5" stroke="#c8cfd8" stroke-width="1.2"/> <text x="38.0" y="72.0" font-size="12.5" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">Word frequency and</text> <text x="38.0" y="88.0" font-size="12.5" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">predictability are benchmark</text> <text x="38.0" y="104.0" font-size="12.5" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">predictors of reading times,</text> <text x="38.0" y="120.0" font-size="12.5" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">with similar effects across</text> <text x="38.0" y="136.0" font-size="12.5" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">languages</text> <text x="38.0" y="158.0" font-size="11.5" fill="#6b6b6b" font-weight="normal" font-style="italic" text-anchor="start">(Kuperman et al., 2024; Smith &amp;</text> <text x="38.0" y="172.5" font-size="11.5" fill="#6b6b6b" font-weight="normal" font-style="italic" text-anchor="start">Levy, 2013)</text> <rect x="253.8" y="52.0" width="214.8" height="135.0" rx="6" fill="#eef1f5" stroke="#c8cfd8" stroke-width="1.2"/> <text x="265.8" y="80.0" font-size="12.5" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">Long syntactic dependencies</text> <text x="265.8" y="96.0" font-size="12.5" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">tax working memory, and the</text> <text x="265.8" y="112.0" font-size="12.5" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">load weighs most heavily on</text> <text x="265.8" y="128.0" font-size="12.5" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">developing readers</text> <text x="265.8" y="150.0" font-size="11.5" fill="#6b6b6b" font-weight="normal" font-style="italic" text-anchor="start">(Gibson, 1998; Delage &amp;</text> <text x="265.8" y="164.5" font-size="11.5" fill="#6b6b6b" font-weight="normal" font-style="italic" text-anchor="start">Frauenfelder, 2019)</text> <rect x="481.5" y="52.0" width="214.8" height="135.0" rx="6" fill="#eef1f5" stroke="#c8cfd8" stroke-width="1.2"/> <text x="493.5" y="88.0" font-size="12.5" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">Breaks in discourse coherence</text> <text x="493.5" y="104.0" font-size="12.5" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">force bridging inferences</text> <text x="493.5" y="120.0" font-size="12.5" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">that cost reading time</text> <text x="493.5" y="142.0" font-size="11.5" fill="#6b6b6b" font-weight="normal" font-style="italic" text-anchor="start">(Kintsch, 1988; McNamara et</text> <text x="493.5" y="156.5" font-size="11.5" fill="#6b6b6b" font-weight="normal" font-style="italic" text-anchor="start">al., 1996)</text> <rect x="709.2" y="52.0" width="214.8" height="135.0" rx="6" fill="#eef1f5" stroke="#c8cfd8" stroke-width="1.2"/> <text x="721.2" y="80.0" font-size="12.5" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">Reading practice builds</text> <text x="721.2" y="96.0" font-size="12.5" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">fluency through</text> <text x="721.2" y="112.0" font-size="12.5" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">automatisation and</text> <text x="721.2" y="128.0" font-size="12.5" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">self-teaching</text> <text x="721.2" y="150.0" font-size="11.5" fill="#6b6b6b" font-weight="normal" font-style="italic" text-anchor="start">(LaBerge &amp; Samuels, 1974;</text> <text x="721.2" y="164.5" font-size="11.5" fill="#6b6b6b" font-weight="normal" font-style="italic" text-anchor="start">Share, 1995; Mol &amp; Bus, 2011)</text> <line x1="475.0" y1="203.0" x2="475.0" y2="233.0" stroke="#33567a" stroke-width="1.4" marker-end="url(#arr)"/> <text x="483.0" y="221.0" font-size="12" fill="#6b6b6b" font-weight="normal" font-style="italic" text-anchor="start">motivates</text> <rect x="14.0" y="239.0" width="922.0" height="450.8" rx="6" fill="#f5f5f5" stroke="#e2e2e2" stroke-width="1.2"/> <text x="26.0" y="257.0" font-size="13" fill="#6b6b6b" font-weight="bold" font-style="normal" text-anchor="start">The theory: constructs and labelled propositions</text> <rect x="326.0" y="299.0" width="214.0" height="53.0" rx="8" fill="#e8eef6" stroke="#33567a" stroke-width="1.4"/> <text x="433.0" y="321.5" font-size="13" fill="#222222" font-weight="bold" font-style="normal" text-anchor="middle">Lexical-distributional</text> <text x="433.0" y="338.0" font-size="13" fill="#222222" font-weight="bold" font-style="normal" text-anchor="middle">difficulty (LexDistPC)</text> <rect x="326.0" y="378.0" width="214.0" height="53.0" rx="8" fill="#e8eef6" stroke="#33567a" stroke-width="1.4"/> <text x="433.0" y="400.5" font-size="13" fill="#222222" font-weight="bold" font-style="normal" text-anchor="middle">Syntactic-structural</text> <text x="433.0" y="417.0" font-size="13" fill="#222222" font-weight="bold" font-style="normal" text-anchor="middle">difficulty (SyntaxPC)</text> <rect x="326.0" y="457.0" width="214.0" height="53.0" rx="8" fill="#e8eef6" stroke="#33567a" stroke-width="1.4"/> <text x="433.0" y="479.5" font-size="13" fill="#222222" font-weight="bold" font-style="normal" text-anchor="middle">Discourse coherence</text> <text x="433.0" y="496.0" font-size="13" fill="#222222" font-weight="bold" font-style="normal" text-anchor="middle">(CoherencePC)</text> <rect x="326.0" y="536.0" width="214.0" height="36.5" rx="8" fill="#e8eef6" stroke="#33567a" stroke-width="1.4"/> <text x="433.0" y="558.5" font-size="13" fill="#222222" font-weight="bold" font-style="normal" text-anchor="middle">Developing reading fluency</text> <rect x="38.0" y="527.8" width="214.0" height="53.0" rx="8" fill="#c9d8ea" stroke="#33567a" stroke-width="1.4"/> <text x="145.0" y="550.2" font-size="13" fill="#222222" font-weight="bold" font-style="normal" text-anchor="middle">Within-child reading</text> <text x="145.0" y="566.8" font-size="13" fill="#222222" font-weight="bold" font-style="normal" text-anchor="middle">experience</text> <rect x="38.0" y="614.8" width="214.0" height="53.0" rx="8" fill="#c9d8ea" stroke="#33567a" stroke-width="1.4"/> <text x="145.0" y="637.2" font-size="13" fill="#222222" font-weight="bold" font-style="normal" text-anchor="middle">Language context (19</text> <text x="145.0" y="653.8" font-size="13" fill="#222222" font-weight="bold" font-style="normal" text-anchor="middle">languages)</text> <rect x="722.0" y="375.8" width="190.0" height="120.0" rx="8" fill="#e8eef6" stroke="#33567a" stroke-width="1.4"/> <text x="817.0" y="440.0" font-size="13" fill="#222222" font-weight="bold" font-style="normal" text-anchor="middle">Reading time per word</text> <text x="328.0" y="291.0" font-size="11.5" fill="#33567a" font-weight="bold" letter-spacing="2.2" opacity="0.75">TEXT</text> <text x="40.0" y="519.8" font-size="11.5" fill="#33567a" font-weight="bold" letter-spacing="2.2" opacity="0.75">READER</text> <text x="40.0" y="606.8" font-size="11.5" fill="#33567a" font-weight="bold" letter-spacing="2.2" opacity="0.75">CONTEXT</text> <text x="724.0" y="367.8" font-size="11.5" fill="#33567a" font-weight="bold" letter-spacing="2.2" opacity="0.75">OUTCOME</text> <line x1="252.0" y1="554.2" x2="320.0" y2="554.2" stroke="#33567a" stroke-width="1.4" marker-end="url(#arr)"/> <text x="286.0" y="549.2" font-size="12" fill="#33567a" font-weight="normal" font-style="italic" text-anchor="middle">P4 increases</text> <path d="M 544.0 325.5 L 607.0 325.5 L 607.0 389.8 L 716.0 389.8" fill="none" stroke="#33567a" stroke-width="1.4" marker-end="url(#arr)"/> <text x="554.0" y="319.5" font-size="12" fill="#33567a" font-weight="normal" font-style="italic" text-anchor="start">P1 increases</text> <path d="M 544.0 404.5 L 623.0 404.5 L 623.0 420.4 L 716.0 420.4" fill="none" stroke="#33567a" stroke-width="1.4" marker-end="url(#arr)"/> <text x="554.0" y="398.5" font-size="12" fill="#33567a" font-weight="normal" font-style="italic" text-anchor="start">P2 increases</text> <path d="M 544.0 483.5 L 639.0 483.5 L 639.0 451.1 L 716.0 451.1" fill="none" stroke="#33567a" stroke-width="1.4" marker-end="url(#arr)"/> <text x="554.0" y="497.5" font-size="12" fill="#33567a" font-weight="normal" font-style="italic" text-anchor="start">P3 decreases</text> <path d="M 544.0 554.2 L 655.0 554.2 L 655.0 481.8 L 716.0 481.8" fill="none" stroke="#33567a" stroke-width="1.4" marker-end="url(#arr)"/> <text x="554.0" y="568.2" font-size="12" fill="#33567a" font-weight="normal" font-style="italic" text-anchor="start">P5 decreases</text> <path d="M 256.0 641.2 L 817.0 641.2 L 817.0 501.8" fill="none" stroke="#33567a" stroke-width="1.4" marker-end="url(#arr)" stroke-dasharray="5,4"/> <text x="266.0" y="635.2" font-size="12" fill="#33567a" font-weight="normal" font-style="italic" text-anchor="start">P6 moderates</text> <line x1="475.0" y1="693.8" x2="475.0" y2="723.8" stroke="#33567a" stroke-width="1.4" marker-end="url(#arr)"/> <text x="483.0" y="711.8" font-size="12" fill="#6b6b6b" font-weight="normal" font-style="italic" text-anchor="start">entails</text> <rect x="14.0" y="729.8" width="922.0" height="236.5" rx="6" fill="#f5f5f5" stroke="#e2e2e2" stroke-width="1.2"/> <text x="26.0" y="747.8" font-size="13" fill="#6b6b6b" font-weight="bold" font-style="normal" text-anchor="start">Predictions, each pre-registered and tested in the confirmatory analysis</text> <rect x="26.0" y="767.8" width="214.8" height="186.5" rx="6" fill="#faf3e0" stroke="#cfa93f" stroke-width="1.2"/> <text x="38.0" y="786.8" font-size="13.5" fill="#8a6d1a" font-weight="bold" font-style="normal" text-anchor="start">Hypothesis 1a</text> <text x="38.0" y="815.5" font-size="12" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">Stories higher in</text> <text x="38.0" y="831.0" font-size="12" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">syntactic-structural</text> <text x="38.0" y="846.5" font-size="12" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">difficulty are read more</text> <text x="38.0" y="862.0" font-size="12" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">slowly: &#946;(SyntaxPC) &gt; 0,</text> <text x="38.0" y="877.5" font-size="12" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">beyond the ROPE.</text> <text x="38.0" y="897.0" font-size="11.5" fill="#8a6d1a" font-weight="normal" font-style="italic" text-anchor="start">weighed against constant-rate</text> <text x="38.0" y="911.5" font-size="11.5" fill="#8a6d1a" font-weight="normal" font-style="italic" text-anchor="start">pacing</text> <text x="228.8" y="940.2" font-size="11.5" fill="#222222" font-weight="bold" font-style="normal" text-anchor="end">Confirmatory model, HDI+ROPE</text> <rect x="253.8" y="767.8" width="214.8" height="186.5" rx="6" fill="#faf3e0" stroke="#cfa93f" stroke-width="1.2"/> <text x="265.8" y="786.8" font-size="13.5" fill="#8a6d1a" font-weight="bold" font-style="normal" text-anchor="start">Hypothesis 1b</text> <text x="265.8" y="815.5" font-size="12" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">Stories higher in</text> <text x="265.8" y="831.0" font-size="12" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">lexical-distributional</text> <text x="265.8" y="846.5" font-size="12" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">difficulty are read more</text> <text x="265.8" y="862.0" font-size="12" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">slowly: &#946;(LexDistPC) &gt; 0,</text> <text x="265.8" y="877.5" font-size="12" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">beyond the ROPE.</text> <text x="265.8" y="897.0" font-size="11.5" fill="#8a6d1a" font-weight="normal" font-style="italic" text-anchor="start">weighed against constant-rate</text> <text x="265.8" y="911.5" font-size="11.5" fill="#8a6d1a" font-weight="normal" font-style="italic" text-anchor="start">pacing</text> <text x="456.5" y="940.2" font-size="11.5" fill="#222222" font-weight="bold" font-style="normal" text-anchor="end">Confirmatory model, HDI+ROPE</text> <rect x="481.5" y="767.8" width="214.8" height="186.5" rx="6" fill="#faf3e0" stroke="#cfa93f" stroke-width="1.2"/> <text x="493.5" y="786.8" font-size="13.5" fill="#8a6d1a" font-weight="bold" font-style="normal" text-anchor="start">Hypothesis 1c</text> <text x="493.5" y="831.0" font-size="12" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">More coherent stories are read</text> <text x="493.5" y="846.5" font-size="12" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">faster: &#946;(CoherencePC) &lt; 0,</text> <text x="493.5" y="862.0" font-size="12" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">beyond the ROPE.</text> <text x="493.5" y="881.5" font-size="11.5" fill="#8a6d1a" font-weight="normal" font-style="italic" text-anchor="start">weighed against constant-rate</text> <text x="493.5" y="896.0" font-size="11.5" fill="#8a6d1a" font-weight="normal" font-style="italic" text-anchor="start">pacing</text> <text x="684.2" y="940.2" font-size="11.5" fill="#222222" font-weight="bold" font-style="normal" text-anchor="end">Confirmatory model, HDI+ROPE</text> <rect x="709.2" y="767.8" width="214.8" height="186.5" rx="6" fill="#faf3e0" stroke="#cfa93f" stroke-width="1.2"/> <text x="721.2" y="786.8" font-size="13.5" fill="#8a6d1a" font-weight="bold" font-style="normal" text-anchor="start">Hypothesis 2</text> <text x="721.2" y="808.8" font-size="12" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">Reading speeds up within child</text> <text x="721.2" y="824.2" font-size="12" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">as reading experience</text> <text x="721.2" y="839.8" font-size="12" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">accumulates: &#946;(Experience) &lt;</text> <text x="721.2" y="855.2" font-size="12" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">0, beyond the ROPE.</text> <text x="721.2" y="874.8" font-size="11.5" fill="#8a6d1a" font-weight="normal" font-style="italic" text-anchor="start">weighed against skimming /</text> <text x="721.2" y="889.2" font-size="11.5" fill="#8a6d1a" font-weight="normal" font-style="italic" text-anchor="start">disengagement and selective</text> <text x="721.2" y="903.8" font-size="11.5" fill="#8a6d1a" font-weight="normal" font-style="italic" text-anchor="start">retention</text> <text x="912.0" y="925.8" font-size="11.5" fill="#222222" font-weight="bold" font-style="normal" text-anchor="end">Confirmatory model + engagement</text> <text x="912.0" y="940.2" font-size="11.5" fill="#222222" font-weight="bold" font-style="normal" text-anchor="end">check</text> <rect x="14.0" y="980.2" width="922.0" height="44.0" rx="10" fill="#ffffff" stroke="#c9302c" stroke-width="1.2"/> <text x="32.0" y="1007.2" font-size="13" fill="#7a1f1c" font-weight="bold" font-style="normal" text-anchor="start">Alternative accounts weighed by the same tests:</text> <rect x="373.7" y="989.2" width="150.8" height="26.0" rx="13" fill="#ffffff" stroke="#c9302c" stroke-width="1.1"/> <text x="449.1" y="1007.2" font-size="12" fill="#222222" font-weight="normal" font-style="normal" text-anchor="middle">Constant-rate pacing</text> <rect x="538.5" y="989.2" width="175.8" height="26.0" rx="13" fill="#ffffff" stroke="#c9302c" stroke-width="1.1"/> <text x="626.4" y="1007.2" font-size="12" fill="#222222" font-weight="normal" font-style="normal" text-anchor="middle">Skimming / disengagement</text> <rect x="728.3" y="989.2" width="144.6" height="26.0" rx="13" fill="#ffffff" stroke="#c9302c" stroke-width="1.1"/> <text x="800.6" y="1007.2" font-size="12" fill="#222222" font-weight="normal" font-style="normal" text-anchor="middle">Selective retention</text> <rect x="14.0" y="1034.2" width="922.0" height="44.0" rx="10" fill="#ffffff" stroke="#c9302c" stroke-width="1.2" stroke-dasharray="5,4"/> <text x="32.0" y="1061.2" font-size="13" fill="#7a1f1c" font-weight="bold" font-style="normal" text-anchor="start">Unmeasured account, bounds interpretation:</text> <rect x="339.9" y="1043.2" width="125.8" height="26.0" rx="13" fill="#ffffff" stroke="#c9302c" stroke-width="1.1" stroke-dasharray="5,4"/> <text x="402.8" y="1061.2" font-size="12" fill="#222222" font-weight="normal" font-style="normal" text-anchor="middle">Narration pacing</text></svg>
