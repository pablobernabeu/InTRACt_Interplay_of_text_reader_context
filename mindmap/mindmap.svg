<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 916" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Theoretical scope of the InTRACt study"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#33567a"/></marker></defs><rect x="0" y="0" width="1060" height="916" fill="#ffffff"/><rect x="14.0" y="14.0" width="1032.0" height="158.0" rx="6" fill="#f5f5f5" stroke="#e2e2e2" stroke-width="1.2"/> <text x="26.0" y="32.0" font-size="11.5" fill="#6b6b6b" font-weight="bold" font-style="normal" text-anchor="start">Builds on the state of the art</text> <rect x="26.0" y="52.0" width="241.5" height="108.0" rx="6" fill="#eef1f5" stroke="#c8cfd8" stroke-width="1.2"/> <text x="38.0" y="71.0" font-size="11" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">Word frequency and predictability are</text> <text x="38.0" y="85.0" font-size="11" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">benchmark predictors of reading times,</text> <text x="38.0" y="99.0" font-size="11" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">with strikingly similar effects across</text> <text x="38.0" y="113.0" font-size="11" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">languages</text> <text x="38.0" y="133.0" font-size="10" fill="#6b6b6b" font-weight="normal" font-style="italic" text-anchor="start">(Kuperman et al., 2024; Smith &amp; Levy,</text> <text x="38.0" y="146.0" font-size="10" fill="#6b6b6b" font-weight="normal" font-style="italic" text-anchor="start">2013)</text> <rect x="281.5" y="52.0" width="241.5" height="108.0" rx="6" fill="#eef1f5" stroke="#c8cfd8" stroke-width="1.2"/> <text x="293.5" y="78.0" font-size="11" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">Long syntactic dependencies tax</text> <text x="293.5" y="92.0" font-size="11" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">working memory, and the load weighs</text> <text x="293.5" y="106.0" font-size="11" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">most heavily on developing readers</text> <text x="293.5" y="126.0" font-size="10" fill="#6b6b6b" font-weight="normal" font-style="italic" text-anchor="start">(Gibson, 1998; Delage &amp; Frauenfelder,</text> <text x="293.5" y="139.0" font-size="10" fill="#6b6b6b" font-weight="normal" font-style="italic" text-anchor="start">2019)</text> <rect x="537.0" y="52.0" width="241.5" height="108.0" rx="6" fill="#eef1f5" stroke="#c8cfd8" stroke-width="1.2"/> <text x="549.0" y="84.5" font-size="11" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">Breaks in discourse coherence force</text> <text x="549.0" y="98.5" font-size="11" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">bridging inferences that cost reading</text> <text x="549.0" y="112.5" font-size="11" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">time</text> <text x="549.0" y="132.5" font-size="10" fill="#6b6b6b" font-weight="normal" font-style="italic" text-anchor="start">(Kintsch, 1988; McNamara et al., 1996)</text> <rect x="792.5" y="52.0" width="241.5" height="108.0" rx="6" fill="#eef1f5" stroke="#c8cfd8" stroke-width="1.2"/> <text x="804.5" y="78.0" font-size="11" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">Reading practice builds fluency</text> <text x="804.5" y="92.0" font-size="11" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">through automatisation and</text> <text x="804.5" y="106.0" font-size="11" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">self-teaching</text> <text x="804.5" y="126.0" font-size="10" fill="#6b6b6b" font-weight="normal" font-style="italic" text-anchor="start">(LaBerge &amp; Samuels, 1974; Share, 1995;</text> <text x="804.5" y="139.0" font-size="10" fill="#6b6b6b" font-weight="normal" font-style="italic" text-anchor="start">Mol &amp; Bus, 2011)</text> <line x1="530.0" y1="176.0" x2="530.0" y2="206.0" stroke="#33567a" stroke-width="1.4" marker-end="url(#arr)"/> <text x="538.0" y="194.0" font-size="10.5" fill="#6b6b6b" font-weight="normal" font-style="italic" text-anchor="start">builds on</text> <rect x="14.0" y="212.0" width="1032.0" height="414.0" rx="6" fill="#f5f5f5" stroke="#e2e2e2" stroke-width="1.2"/> <text x="26.0" y="230.0" font-size="11.5" fill="#6b6b6b" font-weight="bold" font-style="normal" text-anchor="start">The theory: constructs and labelled propositions</text> <rect x="326.0" y="272.0" width="214.0" height="50.0" rx="8" fill="#e8eef6" stroke="#33567a" stroke-width="1.4"/> <text x="433.0" y="293.0" font-size="11.5" fill="#222222" font-weight="bold" font-style="normal" text-anchor="middle">Lexical-distributional</text> <text x="433.0" y="308.0" font-size="11.5" fill="#222222" font-weight="bold" font-style="normal" text-anchor="middle">difficulty (LexDistPC)</text> <rect x="326.0" y="348.0" width="214.0" height="50.0" rx="8" fill="#e8eef6" stroke="#33567a" stroke-width="1.4"/> <text x="433.0" y="369.0" font-size="11.5" fill="#222222" font-weight="bold" font-style="normal" text-anchor="middle">Syntactic-structural difficulty</text> <text x="433.0" y="384.0" font-size="11.5" fill="#222222" font-weight="bold" font-style="normal" text-anchor="middle">(SyntaxPC)</text> <rect x="326.0" y="424.0" width="214.0" height="50.0" rx="8" fill="#e8eef6" stroke="#33567a" stroke-width="1.4"/> <text x="433.0" y="445.0" font-size="11.5" fill="#222222" font-weight="bold" font-style="normal" text-anchor="middle">Discourse coherence</text> <text x="433.0" y="460.0" font-size="11.5" fill="#222222" font-weight="bold" font-style="normal" text-anchor="middle">(CoherencePC)</text> <rect x="326.0" y="500.0" width="214.0" height="35.0" rx="8" fill="#e8eef6" stroke="#33567a" stroke-width="1.4"/> <text x="433.0" y="521.0" font-size="11.5" fill="#222222" font-weight="bold" font-style="normal" text-anchor="middle">Developing reading fluency</text> <rect x="38.0" y="500.0" width="214.0" height="35.0" rx="8" fill="#c9d8ea" stroke="#33567a" stroke-width="1.4"/> <text x="145.0" y="521.0" font-size="11.5" fill="#222222" font-weight="bold" font-style="normal" text-anchor="middle">Within-child reading experience</text> <rect x="38.0" y="569.0" width="214.0" height="35.0" rx="8" fill="#c9d8ea" stroke="#33567a" stroke-width="1.4"/> <text x="145.0" y="590.0" font-size="11.5" fill="#222222" font-weight="bold" font-style="normal" text-anchor="middle">Language context (19 languages)</text> <rect x="832.0" y="359.5" width="190.0" height="88.0" rx="8" fill="#e8eef6" stroke="#33567a" stroke-width="1.4"/> <text x="927.0" y="407.0" font-size="11.5" fill="#222222" font-weight="bold" font-style="normal" text-anchor="middle">Reading time per word</text> <text x="328.0" y="264.0" font-size="10" fill="#33567a" font-weight="bold" letter-spacing="2.2" opacity="0.75">TEXT</text> <text x="40.0" y="492.0" font-size="10" fill="#33567a" font-weight="bold" letter-spacing="2.2" opacity="0.75">READER</text> <text x="40.0" y="561.0" font-size="10" fill="#33567a" font-weight="bold" letter-spacing="2.2" opacity="0.75">CONTEXT</text> <text x="834.0" y="351.5" font-size="10" fill="#33567a" font-weight="bold" letter-spacing="2.2" opacity="0.75">OUTCOME</text> <line x1="252.0" y1="517.5" x2="320.0" y2="517.5" stroke="#33567a" stroke-width="1.4" marker-end="url(#arr)"/> <text x="286.0" y="512.5" font-size="10.5" fill="#33567a" font-weight="normal" font-style="italic" text-anchor="middle">P4 increases</text> <path d="M 544.0 297.0 L 662.0 297.0 L 662.0 373.5 L 826.0 373.5" fill="none" stroke="#33567a" stroke-width="1.4" marker-end="url(#arr)"/> <text x="554.0" y="291.0" font-size="10.5" fill="#33567a" font-weight="normal" font-style="italic" text-anchor="start">P1 increases</text> <path d="M 544.0 373.0 L 678.0 373.0 L 678.0 393.5 L 826.0 393.5" fill="none" stroke="#33567a" stroke-width="1.4" marker-end="url(#arr)"/> <text x="554.0" y="367.0" font-size="10.5" fill="#33567a" font-weight="normal" font-style="italic" text-anchor="start">P2 increases</text> <path d="M 544.0 449.0 L 694.0 449.0 L 694.0 413.5 L 826.0 413.5" fill="none" stroke="#33567a" stroke-width="1.4" marker-end="url(#arr)"/> <text x="554.0" y="443.0" font-size="10.5" fill="#33567a" font-weight="normal" font-style="italic" text-anchor="start">P3 decreases</text> <path d="M 544.0 517.5 L 710.0 517.5 L 710.0 433.5 L 826.0 433.5" fill="none" stroke="#33567a" stroke-width="1.4" marker-end="url(#arr)"/> <text x="554.0" y="511.5" font-size="10.5" fill="#33567a" font-weight="normal" font-style="italic" text-anchor="start">P5 decreases</text> <path d="M 256.0 586.5 L 927.0 586.5 L 927.0 453.5" fill="none" stroke="#33567a" stroke-width="1.4" marker-end="url(#arr)" stroke-dasharray="5,4"/> <text x="266.0" y="580.5" font-size="10.5" fill="#33567a" font-weight="normal" font-style="italic" text-anchor="start">P6 moderates</text> <line x1="530.0" y1="630.0" x2="530.0" y2="660.0" stroke="#33567a" stroke-width="1.4" marker-end="url(#arr)"/> <text x="538.0" y="648.0" font-size="10.5" fill="#6b6b6b" font-weight="normal" font-style="italic" text-anchor="start">entails</text> <rect x="14.0" y="666.0" width="1032.0" height="182.0" rx="6" fill="#f5f5f5" stroke="#e2e2e2" stroke-width="1.2"/> <text x="26.0" y="684.0" font-size="11.5" fill="#6b6b6b" font-weight="bold" font-style="normal" text-anchor="start">Predictions, each pre-registered and tested in the confirmatory analysis</text> <rect x="26.0" y="704.0" width="241.5" height="132.0" rx="6" fill="#faf3e0" stroke="#cfa93f" stroke-width="1.2"/> <text x="38.0" y="722.0" font-size="12" fill="#8a6d1a" font-weight="bold" font-style="normal" text-anchor="start">Hypothesis 1a</text> <text x="38.0" y="749.0" font-size="10.5" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">Stories higher in syntactic-structural</text> <text x="38.0" y="763.0" font-size="10.5" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">difficulty are read more slowly:</text> <text x="38.0" y="777.0" font-size="10.5" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">&#946;(SyntaxPC) &gt; 0, beyond the ROPE.</text> <text x="38.0" y="795.0" font-size="10" fill="#8a6d1a" font-weight="normal" font-style="italic" text-anchor="start">tells against narration pacing</text> <text x="255.5" y="822.0" font-size="10" fill="#222222" font-weight="bold" font-style="normal" text-anchor="end">Confirmatory model, HDI+ROPE</text> <rect x="281.5" y="704.0" width="241.5" height="132.0" rx="6" fill="#faf3e0" stroke="#cfa93f" stroke-width="1.2"/> <text x="293.5" y="722.0" font-size="12" fill="#8a6d1a" font-weight="bold" font-style="normal" text-anchor="start">Hypothesis 1b</text> <text x="293.5" y="742.0" font-size="10.5" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">Stories higher in</text> <text x="293.5" y="756.0" font-size="10.5" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">lexical-distributional difficulty are</text> <text x="293.5" y="770.0" font-size="10.5" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">read more slowly: &#946;(LexDistPC) &gt; 0,</text> <text x="293.5" y="784.0" font-size="10.5" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">beyond the ROPE.</text> <text x="293.5" y="802.0" font-size="10" fill="#8a6d1a" font-weight="normal" font-style="italic" text-anchor="start">tells against narration pacing</text> <text x="511.0" y="822.0" font-size="10" fill="#222222" font-weight="bold" font-style="normal" text-anchor="end">Confirmatory model, HDI+ROPE</text> <rect x="537.0" y="704.0" width="241.5" height="132.0" rx="6" fill="#faf3e0" stroke="#cfa93f" stroke-width="1.2"/> <text x="549.0" y="722.0" font-size="12" fill="#8a6d1a" font-weight="bold" font-style="normal" text-anchor="start">Hypothesis 1c</text> <text x="549.0" y="756.0" font-size="10.5" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">More coherent stories are read faster:</text> <text x="549.0" y="770.0" font-size="10.5" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">&#946;(CoherencePC) &lt; 0, beyond the ROPE.</text> <text x="549.0" y="788.0" font-size="10" fill="#8a6d1a" font-weight="normal" font-style="italic" text-anchor="start">tells against narration pacing</text> <text x="766.5" y="822.0" font-size="10" fill="#222222" font-weight="bold" font-style="normal" text-anchor="end">Confirmatory model, HDI+ROPE</text> <rect x="792.5" y="704.0" width="241.5" height="132.0" rx="6" fill="#faf3e0" stroke="#cfa93f" stroke-width="1.2"/> <text x="804.5" y="722.0" font-size="12" fill="#8a6d1a" font-weight="bold" font-style="normal" text-anchor="start">Hypothesis 2</text> <text x="804.5" y="742.5" font-size="10.5" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">Reading speeds up within child as</text> <text x="804.5" y="756.5" font-size="10.5" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">reading experience accumulates:</text> <text x="804.5" y="770.5" font-size="10.5" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">&#946;(Experience) &lt; 0, beyond the ROPE.</text> <text x="804.5" y="788.5" font-size="10" fill="#8a6d1a" font-weight="normal" font-style="italic" text-anchor="start">tells against skimming / disengagement</text> <text x="804.5" y="801.5" font-size="10" fill="#8a6d1a" font-weight="normal" font-style="italic" text-anchor="start">and selective retention</text> <text x="1022.0" y="822.0" font-size="10" fill="#222222" font-weight="bold" font-style="normal" text-anchor="end">Confirmatory model + engagement check</text> <rect x="14.0" y="862.0" width="1032.0" height="40.0" rx="10" fill="#ffffff" stroke="#c9302c" stroke-width="1.2"/> <text x="32.0" y="887.0" font-size="11.5" fill="#7a1f1c" font-weight="bold" font-style="normal" text-anchor="start">Alternative accounts, put to the same tests:</text> <rect x="319.1" y="870.0" width="113.4" height="24.0" rx="12" fill="#ffffff" stroke="#c9302c" stroke-width="1.1"/> <text x="375.8" y="886.0" font-size="10.5" fill="#222222" font-weight="normal" font-style="normal" text-anchor="middle">Narration pacing</text> <rect x="446.5" y="870.0" width="157.0" height="24.0" rx="12" fill="#ffffff" stroke="#c9302c" stroke-width="1.1"/> <text x="525.0" y="886.0" font-size="10.5" fill="#222222" font-weight="normal" font-style="normal" text-anchor="middle">Skimming / disengagement</text> <rect x="617.5" y="870.0" width="129.7" height="24.0" rx="12" fill="#ffffff" stroke="#c9302c" stroke-width="1.1"/> <text x="682.4" y="886.0" font-size="10.5" fill="#222222" font-weight="normal" font-style="normal" text-anchor="middle">Selective retention</text></svg>
